<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de Perforaciones</title>
<meta name="description" content="Registro de campo de perforaciones, columna estratigráfica y ensayos geofísicos con informe PDF.">
<meta name="theme-color" content="#1F5E57">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: libreta de campo — barra superior, pestañas Perforaciones / Geofísica, fichas, editor a la izquierda y hoja de registro a la derecha; barra de exportación fija abajo */
:root{
  --bg:#EEF0EB; --panel:#FFFFFF; --ink:#1C221F; --muted:#5E6862; --line:#D3D8D0;
  --accent:#1F5E57; --accent-ink:#FFFFFF; --ochre:#A97A1F; --warn:#B4492B; --water:#2F6FAD;
  --paper:#FCFCF9; --paper-ink:#262A27; --paper-line:#8A918C;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1B201D; --ink:#E6E9E4; --muted:#9BA49E; --line:#2E3531;
  --accent:#5EB3A6; --accent-ink:#0D1412; --ochre:#D7A84C; --warn:#E3805F; --water:#74A9E0;
  --paper:#E9EAE4; --paper-ink:#222623; --paper-line:#7C837E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1B201D; --ink:#E6E9E4; --muted:#9BA49E; --line:#2E3531;
  --accent:#5EB3A6; --accent-ink:#0D1412; --ochre:#D7A84C; --warn:#E3805F; --water:#74A9E0;
  --paper:#E9EAE4; --paper-ink:#222623; --paper-line:#7C837E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:28px;line-height:1}
.brand h1 sup{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;vertical-align:6px;margin-left:4px}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill{font-family:var(--f-mono);font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.busy{color:var(--ochre);border-color:var(--ochre)}
.pill.local{color:var(--warn);border-color:var(--warn)}
details.proj{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.proj summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.proj summary::-webkit-details-marker{display:none}
details.proj summary b{font-family:var(--f-display);font-size:19px}
details.proj summary small{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.proj .grid{padding:0 14px 14px}
label.f,div.f{display:flex;flex-direction:column;gap:3px;min-width:0}
label.f>span,div.f>span{font-family:var(--f-display);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input.num{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
input[type=color]{padding:2px;height:36px;cursor:pointer}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
@media (max-width:420px){.span2{grid-column:1/-1}}
.ro{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;padding:7px 9px;border:1px dashed var(--line);border-radius:6px;background:transparent;min-height:37px}
.note{font-size:12.5px;color:var(--muted)}
.note.w{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.02em;padding:8px 14px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:21px}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.layer{border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:44px minmax(0,1fr);overflow:hidden}
.layer .sw{border-right:1px solid var(--line)}
.layer .sw svg{display:block;width:100%;height:100%}
.layer .body{padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.layer-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.layer-h b{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:5px}
.x:hover{color:var(--warn)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.row2.st,.row3.st{grid-template-columns:minmax(0,1fr)}}
.colrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.csw{width:40px;height:32px;border-radius:6px;border:1px solid var(--line);cursor:pointer;flex:none}
.cname{font-size:13.5px;min-width:0;flex:1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mun{border:1px solid rgba(0,0,0,.15);border-radius:6px;height:44px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:2px}
.mun span{font-family:var(--f-mono);font-size:9.5px;line-height:1.1;background:rgba(255,255,255,.82);color:#1C221F;border-radius:3px;padding:1px 3px;white-space:nowrap}
.mun[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.palfoot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.palfoot input{width:56px;flex:none}
.rowS{display:grid;grid-template-columns:70px minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 30px;gap:8px;align-items:end}
@media (max-width:560px){.rowS{grid-template-columns:repeat(3,minmax(0,1fr))}.rowS .x{justify-self:end}}
.btn{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:14px;padding:6px 10px}
.btn.dash{background:transparent;color:var(--accent);border-style:dashed;width:100%}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--paper);color:var(--paper-ink);border-radius:6px;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 140px);overflow:auto}
@media (max-width:900px){.sheet{position:static;max-height:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--paper-ink);padding-bottom:6px}
.sheet-h h3{font-size:20px}
.sheet-h span{font-family:var(--f-mono);font-size:11px}
.sheet h4{font-family:var(--f-display);font-size:15px;margin:6px 0 0;text-transform:uppercase;letter-spacing:.05em}
.sheet svg{width:100%;height:auto;display:block}
.warn{font-size:13px;color:var(--warn);display:flex;flex-direction:column;gap:2px}
.logos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.logo{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 26px 6px 8px;height:52px;display:flex;align-items:center}
.logo img{max-height:38px;max-width:150px;display:block}
.logo .x{position:absolute;top:2px;right:2px;padding:2px 5px;color:#5E6862}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-width:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.ph .num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff}
.ph input{border:none;border-top:1px solid var(--line);border-radius:0;font-size:13.5px}
.example{font-family:var(--f-mono);font-size:11px;background:var(--ochre);color:var(--accent-ink);padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{font-family:var(--f-display);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
.tbl td{padding:3px 4px;border-bottom:1px solid var(--line)}
.tbl td input{padding:4px 6px;font-size:13.5px;min-width:70px}
.tbl td.c{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;padding-right:8px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-body);font-size:14px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;overflow-x:auto}
.dlg{position:fixed;inset:0;background:rgba(10,14,12,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dlg .box{background:var(--panel);border-radius:12px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg .box p{margin:0}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px}
.legend i{display:inline-block;width:22px;height:13px;vertical-align:-2px;margin-right:4px;border:1px solid var(--paper-line)}
.legend i svg{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Bitácora de Perforaciones</h1><span>Registro de campo · columna estratigráfica · geofísica</span></div>
    <span class="pill" id="status">Cargando…</span>
  </header>

  <details class="proj" id="proj">
    <summary><b>Datos del proyecto</b><small id="projSum"></small></summary>
    <div class="grid">
      <label class="f span2"><span>Empresa / consultora</span><input id="pj-empresa" data-k="pj.empresa"></label>
      <label class="f span2"><span>Proyecto</span><input id="pj-nombre" data-k="pj.nombre"></label>
      <label class="f"><span>Cliente</span><input id="pj-cliente" data-k="pj.cliente"></label>
      <label class="f"><span>Ubicación</span><input id="pj-ubicacion" data-k="pj.ubicacion"></label>
      <label class="f"><span>Sistema de coordenadas</span><input id="pj-sistema" data-k="pj.sistema"></label>
      <label class="f"><span>Responsable</span><input id="pj-responsable" data-k="pj.responsable"></label>
      <div class="f full"><span>Logos del informe PDF</span>
        <div class="logos"><div id="logoList" class="logos"></div><button class="btn ghost" id="b-logo" type="button">+ Agregar logo</button></div>
        <input type="file" id="f-logo" accept="image/png,image/jpeg,image/webp" hidden></div>
    </div>
  </details>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-perf" data-tab="perf">Perforaciones<small id="t-perf-n"></small></button>
    <button class="tab" role="tab" id="t-geo" data-tab="geo">Geofísica<small id="t-geo-n"></small></button>
  </div>
  <nav class="chips" id="chips" aria-label="Registros"></nav>
  <div id="main"></div>
</div>

<div class="bar"><div class="in">
  <button class="btn" id="b-pdf1">PDF perforación</button>
  <button class="btn ghost" id="b-pdfall">PDF del proyecto</button>
  <button class="btn ghost" id="b-json">Respaldo</button>
  <button class="btn ghost" id="b-imp">Importar</button>
  <input type="file" id="f-imp" accept=".json,application/json" hidden>
</div></div>

<datalist id="dl-uscs"><option>GW</option><option>GP</option><option>GM</option><option>GC</option><option>SW</option><option>SP</option><option>SM</option><option>SC</option><option>ML</option><option>CL</option><option>OL</option><option>MH</option><option>CH</option><option>OH</option><option>PT</option><option>CL-ML</option><option>SM-SC</option></datalist>
<datalist id="dl-hum"><option>Seco</option><option>Ligeramente húmedo</option><option>Húmedo</option><option>Muy húmedo</option><option>Saturado</option></datalist>
<datalist id="dl-con"><option>Muy blanda</option><option>Blanda</option><option>Media</option><option>Firme</option><option>Muy firme</option><option>Dura</option><option>Muy suelta</option><option>Suelta</option><option>Medianamente densa</option><option>Densa</option><option>Muy densa</option></datalist>
<datalist id="dl-eq"><option>ABEM Terrameter LS 2</option><option>Syscal Pro</option><option>SuperSting R8</option><option>Geode (Geometrics)</option><option>Seistronix RAS-24</option><option>PASI 16S24</option></datalist>
<datalist id="dl-fuente"><option>Mazo 8 kg</option><option>Mazo 10 kg</option><option>Peso caído</option><option>Ruido ambiental (pasivo)</option></datalist>

<script>
/* ---------- Materiales, tramas y colores ---------- */
const MATS={
  relleno:{n:'Relleno antrópico',u:'',c:'#857B6E',p:'relleno'},
  organico:{n:'Capa orgánica',u:'OL',c:'#3D2E22',p:'organico'},
  ceniza:{n:'Ceniza volcánica',u:'MH',c:'#977245',p:'ceniza'},
  arcilla:{n:'Arcilla',u:'CL',c:'#7E4F3A',p:'arcilla'},
  limo:{n:'Limo',u:'ML',c:'#8C7456',p:'limo'},
  arena:{n:'Arena',u:'SM',c:'#A99273',p:'arena'},
  grava:{n:'Grava',u:'GM',c:'#8E8A80',p:'grava'},
  res_ign:{n:'Suelo residual de roca ígnea',u:'MH',c:'#A2603B',p:'res_ign'},
  res_met:{n:'Suelo residual de roca metamórfica',u:'ML',c:'#7D7562',p:'res_met'},
  res_sed:{n:'Suelo residual de roca sedimentaria',u:'CL',c:'#A79A76',p:'res_sed'},
  saprolito:{n:'Saprolito / roca meteorizada',u:'',c:'#9B6A40',p:'saprolito'},
  roca:{n:'Roca',u:'',c:'#6F7275',p:'roca'}
};
const PATS={arcilla:'Líneas horizontales',limo:'Trazos discontinuos',arena:'Puntos',grava:'Círculos',relleno:'Cuadrícula diagonal',organico:'Raíces',ceniza:'Uves',
  res_ign:'Cruces (residual ígneo)',res_met:'Ondas de foliación (residual metamórfico)',res_sed:'Trazos oblicuos y puntos (residual sedimentario)',saprolito:'Diagonales y puntos',roca:'Bloques',liso:'Sin trama'};
/* Carta Munsell: aproximación sRGB de los colores de suelo más comunes */
const MUN=[
 ['10YR 2/1','Negro','#2B2621'],['10YR 2/2','Café muy oscuro','#3D2E22'],['10YR 3/2','Café grisáceo muy oscuro','#4F4234'],['10YR 3/3','Café oscuro','#574330'],
 ['10YR 4/3','Café','#6E5A45'],['10YR 4/6','Café amarillento oscuro','#7B5A32'],['10YR 5/4','Café amarillento','#8C7456'],['10YR 5/6','Café amarillento','#977245'],
 ['10YR 5/8','Café amarillento','#9E6F33'],['10YR 6/4','Café amarillento claro','#A99273'],['10YR 6/6','Amarillo parduzco','#B38E5A'],['10YR 7/3','Café muy pálido','#BFAD94'],
 ['7.5YR 3/4','Café oscuro','#5F3F2A'],['7.5YR 4/4','Café','#7A563B'],['7.5YR 5/6','Café fuerte','#9B6A40'],['7.5YR 5/8','Café fuerte','#A3672F'],
 ['5YR 3/4','Café rojizo oscuro','#613A29'],['5YR 4/4','Café rojizo','#7E4F3A'],['5YR 5/6','Rojo amarillento','#A2603B'],['2.5YR 3/6','Rojo oscuro','#6E3524'],
 ['2.5YR 4/6','Rojo','#8E4430'],['10R 4/6','Rojo','#883F33'],['2.5Y 5/2','Café grisáceo','#7D7562'],['2.5Y 6/4','Café amarillento claro','#A79A76'],
 ['2.5Y 7/4','Amarillo pálido','#BDAE85'],['5Y 5/1','Gris','#7A7A70'],['5Y 6/2','Gris oliva claro','#929078'],['GLEY1 5/10Y','Gris verdoso','#737B70'],
 ['GLEY2 6/5B','Gris azulado','#8A9196'],['N 3/','Gris muy oscuro','#4A4A49'],['N 5/','Gris','#7B7B7A'],['N 7/','Gris claro','#ADADAC']

async function autoCota(o,kz,force){if(o.lat==null||o.lon==null)return false;if(!force&&o.cotaSrc==='manual'&&o[kz]!=='')return false;

const GTIPOS={ert:'Tomografía eléctrica (ERT)',sev:'Sondeo eléctrico vertical (SEV)',sr:'Sísmica de refracción',masw:'MASW (ondas superficiales)'};
const ARREGLOS_ERT=['Wenner','Schlumberger','Wenner-Schlumberger','Dipolo-dipolo','Polo-dipolo','Gradiente'];
const isElec=g=>g.tipo==='ert'||g.tipo==='sev';
const unitOf=g=>isElec(g)?'electrodo':'geófono';
function newLine(tipo){const k={ert:'LT',sev:'SEV',sr:'LS',masw:'MW'}[tipo];const nn=S.geo.filter(g=>g.tipo===tipo).length+1;
  return{id:uid(),codigo:`${k}-${nn}`,tipo,fecha:new Date().toISOString().slice(0,10),equipo:'',operador:'',arreglo:tipo==='sev'?'Schlumberger':tipo==='ert'?'Wenner-Schlumberger':'',
    n:tipo==='sev'?'':'24',esp:tipo==='sev'?'':'5',ini:{},fin:{},az:'',pts:[],lect:[],disp:[],frec:tipo==='masw'?'4.5':tipo==='sr'?'14':'',fuente:tipo==='sev'||tipo==='ert'?'':'Mazo 8 kg',apil:'',reg:'',mue:'',obs:''}}
function azOf(g){const a=g.ini||{},b=g.fin||{};const E0=n(a.e),N0=n(a.n),E1=n(b.e),N1=n(b.n);
  if(!isNaN(E0)&&!isNaN(N0)&&!isNaN(E1)&&!isNaN(N1)&&(E1!==E0||N1!==N0)){let az=Math.atan2(E1-E0,N1-N0)*180/Math.PI;if(az<0)az+=360;return az}
  const z=n(g.az);return isNaN(z)?NaN:((z%360)+360)%360}
function lenOf(g){if(g.tipo==='sev'){const m=Math.max(0,...g.lect.map(l=>n(l.ab2)||0));return m*2}const k=n(g.n),s=n(g.esp);return isNaN(k)||isNaN(s)?NaN:(k-1)*s}
function distIF(g){const a=g.ini||{},b=g.fin||{};const E0=n(a.e),N0=n(a.n),E1=n(b.e),N1=n(b.n);return [E0,N0,E1,N1].some(isNaN)?NaN:Math.hypot(E1-E0,N1-N0)}
function posEN(g,d){const a=g.ini||{};const E0=n(a.e),N0=n(a.n),az=azOf(g)*Math.PI/180;if(isNaN(E0)||isNaN(N0)||isNaN(az))return null;return{e:E0+d*Math.sin(az),n:N0+d*Math.cos(az)}}
function kSev(g,l){const L=n(l.ab2),m=n(l.mn2);if(isNaN(L)||L<=0)return NaN;if(g.arreglo==='Wenner'){const a=2*L/3;return 2*Math.PI*a}if(isNaN(m)||m<=0||m>=L)return NaN;return Math.PI*(L*L-m*m)/(2*m)}
function rhoOf(g,l){const K=kSev(g,l),R=n(l.R);if(!isNaN(K)&&!isNaN(R))return K*R;return n(l.rho)}
function geoWarn(g){const w=[];if(g.tipo!=='sev'){const L=lenOf(g),D=distIF(g);if(!isNaN(L)&&!isNaN(D)&&Math.abs(L-D)>Math.max(1,L*.03))w.push(`La distancia entre el primer y el último ${unitOf(g)} (${D.toFixed(1)} m) no coincide con la longitud del tendido (${L.toFixed(1)} m).`);
  if(g.pts.length&&!isNaN(n(g.n))&&g.pts.length!==n(g.n))w.push(`La tabla tiene ${g.pts.length} ${unitOf(g)}s y el tendido ${n(g.n)}. Genera las coordenadas de nuevo.`)}
  if(isNaN(azOf(g)))w.push(g.tipo==='sev'?'Falta la orientación (azimut) del sondeo.':`Falta la ubicación del último ${unitOf(g)} o el azimut de la línea.`);return w}

function planSVG(lines,bores,W,H,showNums){const all=[];lines.forEach(l=>l.pts.forEach(q=>all.push([n(q.e),n(q.n)])));bores.forEach(b=>all.push([b.e,b.n]));

function genPts(g){const k=n(g.n),s=n(g.esp);if(isNaN(k)||k<2||isNaN(s)||s<=0){toast(`Escribe el número de ${unitOf(g)}s y la distancia entre ellos`);return false}

  const old=g.pts;g.pts=[];for(let i=0;i<k;i++){const d=i*s,pe=posEN(g,d);g.pts.push({id:old[i]?.id||uid(),d:d.toFixed(1),e:pe.e.toFixed(2),n:pe.n.toFixed(2),z:''})}return true}
async function cotasPts(g){let k=0;const far=[];for(const q of g.pts){const E=n(q.e),Nn=n(q.n);if(!validEN(E,Nn))continue;const ll=fromCTM12(E,Nn);if(!demCovers(ll[0],ll[1])){far.push([q,ll]);continue}try{const z=await elevAt(ll[0],ll[1]);if(z!=null){q.z=z.toFixed(1);k++}}catch(e){break}}
  if(far.length){try{const zs=await elevApi(far.map(f=>f[1]));far.forEach((f,i)=>{if(zs[i]!=null){f[0].z=(+zs[i]).toFixed(1);k++}})}catch(e){}}
  if(k&&g.ini&&g.ini.cotaSrc!=='manual'&&g.pts[0]?.z){g.ini.z=g.pts[0].z;g.ini.cotaSrc='auto'}if(k&&g.fin&&g.fin.cotaSrc!=='manual'&&g.pts.length&&!isNaN(distIF(g))){g.fin.z=g.pts[g.pts.length-1].z;g.fin.cotaSrc='auto'}return k}

    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(`COORDENADAS DE ${u.toUpperCase()}S (MAGNA-SIRGAS Origen Nacional)`,M,y);y+=2;
    const cols=[['No.',9,'r'],['Dist. (m)',15,'r'],['Este (m)',25,'r'],['Norte (m)',25,'r'],['Cota (m)',16,'r']];const half=Math.ceil(g.pts.length/2);
    const rowsOf=arr=>arr.map((q,i)=>[q._i,q.d,q.e,q.n,q.z||'—']);const ix=g.pts.map((q,i)=>({...q,_i:i+1}));
    let A=rowsOf(ix.slice(0,half)),B=rowsOf(ix.slice(half));let ra=table(doc,M,y,cols,A,{maxY:250}),rb=table(doc,M+W/2+3,y,cols,B,{maxY:250});y=Math.max(ra.y,rb.y);
    let restA=ra.rest,restB=rb.rest;while(restA.length||restB.length){doc.addPage();header(doc,'REGISTRO DE ENSAYO GEOFÍSICO',g.codigo||'');ra=table(doc,M,30,cols,restA,{maxY:270});rb=table(doc,M+W/2+3,30,cols,restB,{maxY:270});restA=ra.rest;restB=rb.rest;y=Math.max(ra.y,rb.y)}
    if(!el&&g.disp.length){y+=6;if(y>255){doc.addPage();header(doc,'REGISTRO DE ENSAYO GEOFÍSICO',g.codigo||'');y=32}doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('PUNTOS DE DISPARO',M,y);y+=2;
      table(doc,M,y,[['Disparo',24],['Posición (m)',26,'r'],['Este (m)',30,'r'],['Norte (m)',30,'r'],['Observación',76]],g.disp.map(d=>{const pe=posEN(g,n(d.pos));return[d.codigo,d.pos,pe&&!isNaN(n(d.pos))?pe.e.toFixed(2):'—',pe&&!isNaN(n(d.pos))?pe.n.toFixed(2):'—',d.obs]}),{maxY:282});y+=8+g.disp.length*5.4}}
  if(g.obs){y+=6;if(y>280){doc.addPage();header(doc,'REGISTRO DE ENSAYO GEOFÍSICO',g.codigo||'');y=34}doc.setFontSize(6.8);doc.setFont('helvetica','bold');doc.text('Observaciones: ',M,y);const ow=doc.getTextWidth('Observaciones: ');doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(g.obs,W-ow).slice(0,3),M+ow,y)}}
function coverPage(doc,perfs,geos){const M=M0,W=WP;header(doc,'INFORME DE EXPLORACIÓN — RESUMEN');
  const cw=W/3;[['Proyecto',S.pj.nombre],['Cliente',S.pj.cliente],['Ubicación',S.pj.ubicacion],['Sistema de coordenadas',S.pj.sistema],['Responsable',S.pj.responsable],['Registros',`${perfs.length} perforaciones · ${geos.length} ensayos geofísicos`]].forEach((c,i)=>cell(doc,M+(i%3)*cw,28+Math.floor(i/3)*10,cw,10,c[0],c[1]));
  let y=54;if(perfs.length){doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('PERFORACIONES',M,y);y+=2;
    const r=table(doc,M,y,[['Código',18],['Fecha',20],['Norte (m)',26,'r'],['Este (m)',26,'r'],['Cota (m)',20,'r'],['Prof. (m)',18,'r'],['NF (m)',18,'r'],['Estratos',18,'r'],['Muestras',22,'r']],
      perfs.map(p=>[p.codigo,p.fecha,p.norte,p.este,isNaN(n(p.cota))?'—':n(p.cota).toFixed(1),profOf(p).toFixed(2),isNaN(n(p.nf))?'N.E.':n(p.nf).toFixed(2),p.estratos.length,p.muestras.length]),{maxY:150});y=r.y+3;
    doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(...GR);doc.text('N.E.: nivel freático no encontrado',M,y+1);doc.setTextColor(...INK);y+=8}
  if(geos.length){doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('ENSAYOS GEOFÍSICOS',M,y);y+=2;
    const r=table(doc,M,y,[['Código',18],['Ensayo',52],['Fecha',20],['Arreglo / fuente',36],['Puntos',16,'r'],['Esp. (m)',18,'r'],['Long. (m)',26,'r']],
      geos.map(g=>{const L=lenOf(g);return[g.codigo,GTIPOS[g.tipo],g.fecha,isElec(g)?g.arreglo:g.fuente,g.tipo==='sev'?g.lect.length:g.n,g.tipo==='sev'?'—':g.esp,isNaN(L)||!L?'—':L.toFixed(1)]}),{maxY:200});y=r.y+8}
  const sel=perfs.slice(0,12);if(!sel.length||y>205)return;doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('COLUMNAS COMPARADAS (misma escala vertical)',M,y);y+=9;
  const maxP=Math.max(...sel.map(profPlot));const sc=Math.min((272-y-6)/maxP,30);const cwid=Math.min(14,(W/sel.length)*.45);
  doc.setFont('helvetica','normal');doc.setFontSize(6);const st=maxP>12?2:maxP>4?1:0.5;
  for(let z=0;z<=maxP+1e-6;z+=st){doc.setDrawColor(220,223,218);doc.setLineWidth(.1);doc.line(M+8,y+z*sc,M+W,y+z*sc);doc.text(z.toFixed(st<1?1:0),M+6.5,y+z*sc+1,{align:'right'})}
  sel.forEach((p,i)=>{const cx=M+10+i*((W-10)/sel.length)+((W-10)/sel.length-cwid)/2;doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text(p.codigo||'',cx+cwid/2,y-2,{align:'center'});
    for(const e of p.estratos){const d=n(e.desde),h=n(e.hasta);if(isNaN(d)||isNaN(h)||h<=d)continue;ebox(doc,e,cx,y+d*sc,cwid,(h-d)*sc,1.8);doc.setDrawColor(...GR);doc.setLineWidth(.15);doc.line(cx,y+h*sc,cx+cwid,y+h*sc)}
    doc.setDrawColor(...INK);doc.setLineWidth(.25);doc.rect(cx,y,cwid,profPlot(p)*sc);const nf=n(p.nf);if(!isNaN(nf)){doc.setFillColor(...WAT);doc.triangle(cx+cwid+.6,y+nf*sc-1.6,cx+cwid+3.4,y+nf*sc-1.6,cx+cwid+2,y+nf*sc,'F')}})}
function locationPage(doc,perfs,geos){const bores=perfs.filter(p=>validEN(n(p.este),n(p.norte))).map(p=>({codigo:p.codigo,e:n(p.este),n:n(p.norte)}));
  const lines=geos.map(g=>({g,pts:g.tipo==='sev'?(validEN(n(g.ini?.e),n(g.ini?.n))?[{e:g.ini.e,n:g.ini.n,d:0}]:[]):geoPts(g)})).filter(l=>l.pts.length);
  if(!bores.length&&!lines.length)return false;doc.addPage();header(doc,'PLANO DE LOCALIZACIÓN');const M=M0,W=WP;drawPlanPdf(doc,M,30,W,200,lines,bores,false);
  let y=238;doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text('CONVENCIONES',M,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(6.5);
  doc.setDrawColor(...INK);doc.setFillColor(255,255,255);doc.circle(M+1.5,y-1,1.3,'FD');doc.setFillColor(...INK);doc.circle(M+1.5,y-1,.45,'F');doc.text('Perforación',M+5,y);
  doc.setFillColor(...OCH);doc.circle(M+36,y-1,.75,'F');doc.text('Electrodo / centro de SEV',M+39,y);doc.setFillColor(...WAT);doc.circle(M+80,y-1,.75,'F');doc.text('Geófono',M+83,y);
  doc.setFillColor(...WRN);doc.triangle(M+104,y-2.6,M+105.5,y,M+102.5,y,'F');doc.text('Punto de disparo',M+108,y);
  y+=6;doc.setFontSize(6);doc.setTextColor(...GR);doc.text(doc.splitTextToSize(`Coordenadas planas ${S.pj.sistema||'MAGNA-SIRGAS / Origen Nacional'}. Escala gráfica en metros.`,W),M,y);doc.setTextColor(...INK);return true}
function photoPages(doc,p,imgs){const fs=(p.fotos||[]);if(!fs.length)return;const M=M0,W=WP,cw=(W-6)/2,ih=64,rowH=ih+13;
  fs.forEach((fo,i)=>{const k=i%6;if(k===0){doc.addPage();header(doc,'REGISTRO FOTOGRÁFICO',p.codigo||'');}
    const x=M+(k%2)*(cw+6),y=31+Math.floor(k/2)*(rowH+4);const im=imgs[fo.id];
    doc.setDrawColor(...GR);doc.setLineWidth(.2);doc.rect(x,y,cw,ih);
    if(im){let w=cw,h=w*im.h/im.w;if(h>ih){h=ih;w=h*im.w/im.h}try{doc.addImage(im.d,'JPEG',x+(cw-w)/2,y+(ih-h)/2,w,h)}catch(e){}}
    else{doc.setFontSize(7);doc.setTextColor(...GR);doc.text('Imagen no disponible',x+cw/2,y+ih/2,{align:'center'});doc.setTextColor(...INK)}
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);const lab=`Foto ${i+1}. `;doc.text(lab,x,y+ih+4);const lw=doc.getTextWidth(lab);
    doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(fo.cap||`Perforación ${p.codigo||''}`,cw-lw).slice(0,2),x+lw,y+ih+4)})}
/* borra el nombre del programa generador en las propiedades del archivo, sin cambiar su longitud */
function scrubProducer(buf){const u=new Uint8Array(buf);const pat=[...'/Producer ('].map(c=>c.charCodeAt(0));
  outer:for(let i=0;i<u.length-pat.length;i++){for(let j=0;j<pat.length;j++)if(u[i+j]!==pat[j])continue outer;let k=i+pat.length;while(k<u.length&&u[k]!==41){u[k]=32;k++}break}return buf}
async function exportPdf(perfs,geos,name,cover){if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Revisa la conexión.');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});let first=true;
  doc.setProperties({title:name.replace(/\.pdf$/,'').replace(/_/g,' '),subject:S.pj.nombre||'',author:S.pj.empresa||'',creator:S.pj.empresa||'',keywords:''});
  if(cover){coverPage(doc,perfs,geos);first=false;if(locationPage(doc,perfs,geos))first=false}
  const nF=perfs.reduce((a,p)=>a+(p.fotos||[]).length,0);const imgs={};
  if(nF){toast(`Preparando ${nF} fotos para el PDF…`);for(const p of perfs)for(const fo of (p.fotos||[])){try{const c=await shrink(fo.data,1200);imgs[fo.id]={d:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height}}catch(e){}}}
  for(const p of perfs){if(!first)doc.addPage();first=false;logPage(doc,p);photoPages(doc,p,imgs)}
  for(const g of geos){if(!first)doc.addPage();first=false;geoPage(doc,g)}
  const tot=doc.getNumberOfPages();const hoy=new Date().toLocaleDateString('es-CO');
  for(let i=1;i<=tot;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GR);doc.text(`${S.pj.nombre||''}${S.pj.nombre?' · ':''}Fecha de emisión ${hoy}`.slice(0,110),12,290);doc.text(`Página ${i} de ${tot}`,198,290,{align:'right'})}
  await saveFile(name,scrubProducer(doc.output('arraybuffer')))}

boot();
